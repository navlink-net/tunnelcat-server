[project]
name = "tunnelcat-sdk"
version = "0.1.0"
description = "Python SDK for tunnelcat-server (spawns tunneld, drives it over its JSON-RPC socket)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tunnelcat_sdk*"]
