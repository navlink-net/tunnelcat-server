{{template "base" .}}

{{define "content"}}
<div style="max-width:360px;margin:4rem auto;background:#fff;border:1px solid #ddd;border-radius:8px;padding:2rem">
  <h1 style="font-size:1.2rem;margin-bottom:1rem">Admin sign in</h1>
  {{if .Flash}}
    <div style="background:#fee;border:1px solid #fbb;color:#900;padding:.6rem .8rem;border-radius:4px;margin-bottom:1rem;font-size:14px">{{.Flash}}</div>
  {{end}}
  <form method="post" action="/admin/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <div style="margin-bottom:.8rem">
      <label style="display:block;font-size:13px;color:#555;margin-bottom:.25rem">Email</label>
      <input type="email" name="username" autocomplete="email" autofocus required style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px">
    </div>
    <div style="margin-bottom:1.2rem">
      <label style="display:block;font-size:13px;color:#555;margin-bottom:.25rem">Password</label>
      <input type="password" name="password" autocomplete="current-password" required style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px">
    </div>
    <button type="submit" style="width:100%;padding:.6rem;background:#1a1a2e;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer">Sign in</button>
  </form>
</div>
{{end}}
