{{define "content"}}
<div style="max-width:380px;margin:4rem auto">
  <h1 style="margin-bottom:1.5rem;text-align:center">Sign in to My Account</h1>
  {{if .Flash}}
  <div class="alert alert-danger">{{.Flash}}</div>
  {{end}}
  <div class="card">
    <form method="post" action="/my/login">
      <div class="form-group">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" autocomplete="email" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem">Sign in</button>
    </form>
  </div>
</div>
{{end}}
